services:
  - type: web
    name: nivora-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_SSL
        value: "true"
      - key: SUPABASE_BUCKET
        value: hotel-images
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GUEST_JWT_SECRET
        sync: false
      - key: GUEST_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
